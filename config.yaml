exchange: binance
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
timeframe: 15m
bars: 3000

model:
  horizon_bars: 4
  train_window: 1200
  min_train_rows: 400
  retrain_every: 24

market_maker:
  order_notional_usdt: 100.0
  max_inventory_usdt: 1000.0
  base_half_spread_bps: 4.0
  min_half_spread_bps: 2.0
  vol_spread_multiplier: 0.35
  signal_weight: 0.60
  max_signal_bps: 20.0
  inventory_skew_bps: 12.0

backtest:
  initial_cash_usdt: 10000.0
  maker_fee_bps: 2.0
  max_drawdown_pct: 0.15

paths:
  cache_dir: data/cache
  results_dir: results
