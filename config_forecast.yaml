exchange: gate
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT

timeframes:
  - 15m
  - 1h
  - 4h
  - 1d

bars: 5000
results_dir: results/forecast

# Persistent public OHLCV cache.
# First run downloads the requested history; later runs refresh only a small
# recent overlap and append/deduplicate it. Cache files keep growing over time.
market_data:
  use_cache: true
  cache_dir: data/cache/ohlcv

# Forecast clock policy.
# - All new forecasts use exchange-native candle boundaries.
# - Gate native 1d candles use UTC 00:00 -> next UTC 00:00.
# - Dashboard timestamps are shown in Asia/Shanghai, so Gate 1d appears as
#   Beijing 08:00 -> next-day 08:00.
# - `daily_candle_timezone` is kept as UTC for backward-compatible UI/config
#   labels; data.py no longer rebuilds new daily candles from 4h data.
time:
  daily_candle_timezone: UTC
  display_timezone: Asia/Shanghai

forecast:
  train_window: 5000
  min_train_rows: 700
  validation_fraction: 0.20
  neutral_threshold_bps: 8.0
  strong_threshold_bps: 25.0
  min_signal_confidence: 0.52
  random_state: 42

  # Model ensemble.
  # Baseline: Linear + Ridge + HistGradientBoosting.
  # Advanced adds ElasticNet + ExtraTrees.
  use_advanced_models: true

  # Once enough real settled forecasts exist for a symbol/timeframe, blend
  # out-of-sample realized model performance with current validation weights.
  realized_weight_blend: 0.65
  realized_weight_min_samples: 30

  # Optional training-sample recency weighting. 0 disables it.
  # Example: 1500 means a sample 1500 bars older has about half the training
  # weight of the newest sample. Dashboard can override this interactively.
  recency_half_life_bars: 0

  # Optional human preference multipliers applied after automatic validation /
  # realized-performance weights, then normalized. Runtime bounds: 0.25x..2.0x.
  # Leave empty for fully automatic model weighting.
  manual_model_multipliers: {}

# Institutional alpha layer.
# This is intentionally separated from the next-close price model until enough
# out-of-sample alpha history exists. It provides independent confirmation,
# crowding/risk context and its own long-term factor leaderboard.
institutional_alpha:
  use_gate_derivatives: true
  derivatives_history_points: 96
